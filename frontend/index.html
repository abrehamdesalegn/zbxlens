<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZbxLens</title>
  <link rel="icon" href="/icon.png?v=5.1.3" type="image/png" sizes="512x512">
  <link rel="icon" href="/favicon.svg?v=5.1.3" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png?v=5.1.3" type="image/png" sizes="32x32">
  <link rel="icon" href="/favicon.ico?v=5.1.3" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5.1.3">
  <link rel="stylesheet" href="/css/app.css?v=5.1.6col">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">
      <img src="/icon.png?v=5.1.3" width="40" height="40" alt="ZbxLens" draggable="false">
    </div>
    <div>
      <div class="eyebrow">Zabbix &middot; Metrics &amp; Problems</div>
      <h1>ZbxLens</h1>
    </div>
  </div>
  <div class="nav-tabs nav-tabs-header" id="navTabs">
    <button type="button" class="active" data-nav="dashboards">Metrics</button>
    <button type="button" data-nav="problems">Problems</button>
  </div>
  <div class="pulse-wrap" id="pulseWrap" title="DB query latency (live)">
    <canvas id="pulse" width="120" height="28" aria-label="DB latency sparkline"></canvas>
    <div class="live-dot" id="liveDot"><span class="dot"></span><span id="liveLabel">checking…</span></div>
  </div>
  <div class="header-actions" id="uiExtras">
    <button type="button" class="icon-btn" id="themeBtn" title="Cycle theme (auto / dark / light)" aria-label="Theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
    <div class="prefs-wrap">
      <button type="button" class="chip-btn" id="prefsBtn" title="Display preferences">Display</button>
      <div class="prefs-popover" id="prefsPopover" role="dialog" aria-label="Display preferences">
        <div class="prefs-section">
          <div class="prefs-section-label">Theme</div>
          <div class="prefs-seg" role="group" aria-label="Theme">
            <button type="button" class="prefs-seg-btn" data-pref-theme="auto">Auto</button>
            <button type="button" class="prefs-seg-btn" data-pref-theme="dark">Dark</button>
            <button type="button" class="prefs-seg-btn" data-pref-theme="light">Light</button>
          </div>
          <select id="prefTheme" class="sr-only" aria-hidden="true" tabindex="-1">
            <option value="auto">Auto</option><option value="dark">Dark</option><option value="light">Light</option>
          </select>
        </div>
        <div class="prefs-section">
          <div class="prefs-section-label">Density</div>
          <div class="prefs-seg" role="group" aria-label="Density">
            <button type="button" class="prefs-seg-btn" data-pref-density="compact">Compact</button>
            <button type="button" class="prefs-seg-btn" data-pref-density="comfortable">Comfortable</button>
          </div>
          <select id="prefDensity" class="sr-only" aria-hidden="true" tabindex="-1">
            <option value="compact">Compact</option><option value="comfortable">Comfortable</option>
          </select>
        </div>
        <label class="prefs-row">Text size <select id="prefFont">
          <option value="sm">Small</option>
          <option value="md">Medium</option>
          <option value="lg">Large</option>
        </select></label>
      </div>
    </div>
  </div>
  <div class="user-badge" id="userBadge" style="display:none;"></div>
</header>

<main>

  <div id="dashboardsView"></div>
  <div id="problemsView" style="display:none"></div>

  <div class="modal-backdrop" id="loginModal">
    <div class="modal">
      <h3>Sign in with Zabbix</h3>
      <p>Use your Zabbix username and password. What you can see and save here follows your Zabbix host-group permissions and role.</p>
      <form id="loginForm">
        <input type="text" id="loginUsername" placeholder="Username" autocomplete="username" autofocus>
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        <div class="status-msg warn" id="loginError" style="display:none;margin-bottom:10px;"></div>
        <div class="row">
          <button type="submit" class="btn btn-primary" id="loginSubmit"><span class="spinner"></span><span class="btn-label">Sign in</span></button>
        </div>
      </form>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="detailDrawer" aria-label="Details">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 id="drawerTitle">Details</h3>
      <button type="button" class="btn btn-ghost" id="drawerClose" style="height:32px;">Close</button>
    </div>
    <div id="drawerBody"></div>
  </aside>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <input type="file" id="importFileInput" accept="application/json" style="display:none">

</main>

<!--
  Frontend modules (classic scripts, global scope — load order matters).
  Zero-build: no bundler required. FastAPI serves these as static files.
  Order: core → utils (shared helpers) → ui → dashboards → problems (boot).
-->
<script src="/js/core.js?v=5.1.4qv"></script>
<script src="/js/export.js?v=5.0.0n"></script>
<script src="/js/utils.js?v=5.0.0u"></script>
<script src="/js/ui.js?v=5.1.4qv"></script>
<script src="/js/dashboards.js?v=5.1.7mult"></script>
<script src="/js/problems.js?v=5.1.4err"></script>

</body>
</html>

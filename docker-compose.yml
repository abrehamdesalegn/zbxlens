services:
  reporter:
    build: .
    image: zbxlens:5.0.0
    ports:
      - "${ZR_PORT:-8000}:8000"
    env_file:
      - backend/.env
    environment:
      # Safe defaults; override in backend/.env as needed
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      # Persist sessions, dashboards, presets, pins.
      # Must be writable by container UID 10001:
      #   mkdir -p backend/data && sudo chown -R 10001:10001 backend/data
      - ./backend/data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Uncomment under load:
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2"
    #       memory: 1G
